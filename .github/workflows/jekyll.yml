name: Build and deploy Jekyll site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Jekyll leaves out posts dated in the future, so posts committed ahead of
  # time only appear once the site is rebuilt after their date. This hourly
  # run rebuilds whenever a post has recently come due (see the check job).
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # On scheduled runs, only rebuild if a post's date fell in the last few
  # hours. The window is wider than the hourly schedule so a delayed or
  # dropped scheduled run doesn't leave a post unpublished.
  check:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Look for posts that have come due
        id: due
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/scripts/posts-due.sh 6 >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
