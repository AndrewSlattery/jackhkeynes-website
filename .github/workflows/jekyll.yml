name: Build and deploy Jekyll site

on:
  push:
    branches: ["main"]
  # Jekyll leaves out posts dated in the future, so posts committed ahead of
  # time only appear once the site is rebuilt after their date. cron-job.org
  # triggers this hourly with only_if_due, which rebuilds only when a post has
  # come due (see the check job). The schedule below is a backup, since
  # GitHub often runs it hours late.
  workflow_dispatch:
    inputs:
      only_if_due:
        description: "Only rebuild if a scheduled post has come due"
        type: boolean
        default: false
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # On scheduled and only_if_due runs, only rebuild if a post whose date has
  # passed isn't on the live site yet. Pushes and manual runs always rebuild.
  check:
    runs-on: ubuntu-latest
    env:
      CHECK: ${{ github.event_name == 'schedule' || inputs.only_if_due }}
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - name: Checkout
        if: env.CHECK == 'true'
        uses: actions/checkout@v4

      - name: Look for posts that have come due
        id: due
        run: |
          if [ "$CHECK" != "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/scripts/posts-due.sh https://jackhkeynes.co.uk/published-posts.txt >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
